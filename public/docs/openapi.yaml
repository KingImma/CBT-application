openapi: 3.0.3
info:
  title: 'EduCBT API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: 'Academic Calendar'
    description: '* APIs for defining school years and terms.'
  -
    name: 'Authentication & Onboarding'
    description: '* APIs for user login, password resets, and initial school onboarding.'
  -
    name: 'Classes & Arms'
    description: '* APIs for managing class structures (e.g., JSS1) and specific arms (e.g., JSS1A), including subject mapping.'
  -
    name: 'Curriculum & Subjects'
    description: '* APIs for managing the academic curriculum and subject topics.'
  -
    name: Endpoints
    description: ''
  -
    name: 'Exam Administration'
    description: '* APIs for scheduling CBT sessions, attaching questions, live monitoring, and grading.'
  -
    name: 'Question Bank'
    description: "\nAPIs for creating and managing objective and theory questions."
  -
    name: 'School Configuration'
    description: '* APIs for managing tenant-specific preferences and global grading scales.'
  -
    name: 'Staff Directory'
    description: '* APIs for managing teachers, roles, and subject assignments.'
  -
    name: 'Student Portal'
    description: "\nAPIs for students to access and take exams."
  -
    name: 'Student Roster'
    description: '* APIs for managing student enrollments, profiles, and class placements.'
  -
    name: 'Super Admin: Billing & Subscriptions'
    description: '* APIs for managing available SaaS tiers and subscription logic.'
  -
    name: 'Super Admin: Platform Analytics'
    description: '* APIs for global SaaS metrics and platform-wide monitoring.'
  -
    name: 'Super Admin: Tenant Management'
    description: '* APIs for provisioning, suspending, and managing school instances.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "All endpoints (except authentication & onboarding) require a Sanctum Bearer token.\n\n**How to authenticate:**\n1. Call `POST /api/auth/login` with your `identifier` and `password`.\n2. The response will include an `access_token`.\n3. Pass this token as a Bearer token in the `Authorization` header for all subsequent requests.\n\n**For tenants (schools):** Use the tenant's subdomain URL and a tenant user's credentials (admin, teacher, or student).\n**For super admins:** Use the central domain URL and super admin credentials."
security:
  -
    default: []
paths:
  /api/academic-sessions:
    get:
      summary: 'List all academic sessions with their terms.'
      operationId: listAllAcademicSessionsWithTheirTerms
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Academic Calendar'
    post:
      summary: 'Create a new academic session.'
      operationId: createANewAcademicSession
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Session name.'
                  example: '"2025/2026"'
                start_date:
                  type: string
                  description: 'Start date (Y-m-d).'
                  example: null
                end_date:
                  type: string
                  description: 'End date (Y-m-d), must be after start_date.'
                  example: null
                is_current:
                  type: boolean
                  description: 'Set as the current session.'
                  example: null
              required:
                - name
                - start_date
                - end_date
  '/api/academic-sessions/{id}':
    get:
      summary: 'Get a single academic session with its terms.'
      operationId: getASingleAcademicSessionWithItsTerms
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Academic Calendar'
    put:
      summary: 'Update an academic session.'
      operationId: updateAnAcademicSession
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Session name.'
                  example: null
                start_date:
                  type: string
                  description: 'Start date.'
                  example: null
                end_date:
                  type: string
                  description: 'End date.'
                  example: null
                is_current:
                  type: boolean
                  description: 'Set as current.'
                  example: null
    delete:
      summary: 'Delete an academic session.'
      operationId: deleteAnAcademicSession
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
    parameters:
      -
        in: path
        name: id
        description: 'The session UUID.'
        example: id
        required: true
        schema:
          type: string
  '/api/academic-sessions/{id}/set-current':
    post:
      summary: 'Set a session as the current one.'
      operationId: setASessionAsTheCurrentOne
      description: 'Only one session can be current at a time.'
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the academic session.'
        example: id
        required: true
        schema:
          type: string
  '/api/academic-sessions/{academic_session_id}/terms':
    get:
      summary: 'List all terms for an academic session.'
      operationId: listAllTermsForAnAcademicSession
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Academic Calendar'
    post:
      summary: 'Create a new term within an academic session.'
      operationId: createANewTermWithinAnAcademicSession
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Term name.'
                  example: '"First Term"'
                start_date:
                  type: string
                  description: 'Start date (Y-m-d).'
                  example: null
                end_date:
                  type: string
                  description: 'End date (Y-m-d), must be after start_date.'
                  example: null
                is_current:
                  type: boolean
                  description: 'Set as the current term.'
                  example: null
              required:
                - name
                - start_date
                - end_date
    parameters:
      -
        in: path
        name: academic_session_id
        description: 'The ID of the academic session.'
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: sessionId
        description: 'The academic session UUID.'
        example: id
        required: true
        schema:
          type: string
  '/api/academic-sessions/{academic_session_id}/terms/{id}':
    put:
      summary: 'Update a term.'
      operationId: updateATerm
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Term name.'
                  example: null
                start_date:
                  type: string
                  description: 'Start date.'
                  example: null
                end_date:
                  type: string
                  description: 'End date.'
                  example: null
                is_current:
                  type: boolean
                  description: 'Set as current.'
                  example: null
    delete:
      summary: 'Delete a term.'
      operationId: deleteATerm
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
    parameters:
      -
        in: path
        name: academic_session_id
        description: 'The ID of the academic session.'
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'The term UUID.'
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: sessionId
        description: 'The academic session UUID.'
        example: id
        required: true
        schema:
          type: string
  '/api/academic-sessions/{sessionId}/terms/{id}/set-current':
    post:
      summary: 'Set a term as current within its session.'
      operationId: setATermAsCurrentWithinItsSession
      description: 'The session must already be current.'
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
    parameters:
      -
        in: path
        name: sessionId
        description: ''
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'The ID of the term.'
        example: id
        required: true
        schema:
          type: string
  /api/auth/login:
    post:
      summary: 'Authenticate a user and return a token.'
      operationId: authenticateAUserAndReturnAToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: 'Email or username.'
                  example: '"admin@school.edu"'
                password:
                  type: string
                  description: "The user's password."
                  example: null
              required:
                - identifier
                - password
  /api/onboarding/check-handle:
    get:
      summary: 'Check if a school handle is available.'
      operationId: checkIfASchoolHandleIsAvailable
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Handle availability checked.'
                  data:
                    available: true
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Handle availability checked.'
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                        example: true
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                  description: 'Desired school handle (subdomain).'
                  example: '"greenwood-high"'
              required:
                - handle
  /api/onboarding/register:
    post:
      summary: 'Register a new school (tenant).'
      operationId: registerANewSchooltenant
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schoolName:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: svgeelwushecsyjwvb
                handle:
                  type: string
                  description: 'Unique school handle for subdomain.'
                  example: null
                address:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: nukiosptbbvcnfezyr
                  nullable: true
                state:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: khfgmauogqejbyrpvh
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: qvorlhgxqdslgcxqtn
                  nullable: true

                fullName:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vgeelwushecsyjwvbp
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: abigale73@example.net
                phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: bfv
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '<xGu:0Vc&ao==Ol'
                plan_id:
                  type: string
                  description: 'nullable Subscription plan UUID.'
                  example: null
                  nullable: true
                school_name:
                  type: string
                  description: 'School name.'
                  example: '"Greenwood High School"'
                admin_email:
                  type: string
                  description: 'Admin email address.'
                  example: null
                admin_first_name:
                  type: string
                  description: 'Admin first name.'
                  example: null
                admin_last_name:
                  type: string
                  description: 'Admin last name.'
                  example: null
                admin_phone:
                  type: string
                  description: 'nullable Admin phone number.'
                  example: null
              required:
                - schoolName
                - handle
                - fullName
                - email
                - phone
                - password
                - school_name
                - admin_email
                - admin_first_name
                - admin_last_name
  /api/password/forgot:
    post:
      summary: "Send a password reset OTP to the user's email."
      operationId: sendAPasswordResetOTPToTheUsersEmail
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "User's email address."
                  example: null
              required:
                - email
  /api/password/verify-otp:
    post:
      summary: 'Verify the OTP and receive a reset token.'
      operationId: verifyTheOTPAndReceiveAResetToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "User's email address."
                  example: null
                otp:
                  type: string
                  description: 'The 6-digit OTP code.'
                  example: '"123456"'
              required:
                - email
                - otp
  /api/password/reset:
    post:
      summary: 'Reset the password using a verified reset token.'
      operationId: resetThePasswordUsingAVerifiedResetToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reset_token:
                  type: string
                  description: 'The reset token from OTP verification.'
                  example: null
                password:
                  type: string
                  description: 'New password (min 8 chars, must contain number).'
                  example: null
                password_confirmation:
                  type: string
                  description: 'Confirm the new password.'
                  example: null
              required:
                - reset_token
                - password
                - password_confirmation
  /api/password/change:
    post:
      summary: 'Change password for an authenticated user.'
      operationId: changePasswordForAnAuthenticatedUser
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: 'Current password.'
                  example: null
                password:
                  type: string
                  description: 'New password (min 8 chars, must contain number).'
                  example: null
                password_confirmation:
                  type: string
                  description: 'Confirm the new password.'
                  example: null
              required:
                - current_password
                - password
                - password_confirmation
  /api/super-admin/logout:
    post:
      summary: 'Logout the user and invalidate the token.'
      operationId: logoutTheUserAndInvalidateTheToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
  /api/super-admin/me:
    get:
      summary: "Get the authenticated user's profile."
      operationId: getTheAuthenticatedUsersProfile
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Authentication & Onboarding'
  /api/auth/logout:
    post:
      summary: 'Logout the user and invalidate the token.'
      operationId: logoutTheUserAndInvalidateTheToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
  /api/auth/me:
    get:
      summary: "Get the authenticated user's profile."
      operationId: getTheAuthenticatedUsersProfile
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Authentication & Onboarding'
  '/api/class-levels/{id}/assign-teacher':
    patch:
      summary: 'Assign a teacher to a class level.'
      operationId: assignATeacherToAClassLevel
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teacher_id:
                  type: string
                  description: 'The teacher UUID.'
                  example: null
              required:
                - teacher_id
    parameters:
      -
        in: path
        name: id
        description: 'The class level UUID.'
        example: id
        required: true
        schema:
          type: string
  /api/class-levels:
    get:
      summary: 'List all class levels with arm and student counts.'
      operationId: listAllClassLevelsWithArmAndStudentCounts
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Classes & Arms'
    post:
      summary: 'Create a new class level.'
      operationId: createANewClassLevel
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Class level name.'
                  example: '"JSS 1"'
              required:
                - name
  '/api/class-levels/{id}':
    get:
      summary: 'Get a single class level with its arms and subjects.'
      operationId: getASingleClassLevelWithItsArmsAndSubjects
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Classes & Arms'
    put:
      summary: 'Update a class level.'
      operationId: updateAClassLevel
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Class level name.'
                  example: null
                order:
                  type: integer
                  description: 'Display order.'
                  example: null
                  nullable: true
    delete:
      summary: 'Delete a class level (must have no students assigned).'
      operationId: deleteAClassLevelmustHaveNoStudentsAssigned
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
    parameters:
      -
        in: path
        name: id
        description: 'The class level UUID.'
        example: id
        required: true
        schema:
          type: string
  '/api/class-levels/{classLevelId}/arms':
    get:
      summary: 'List all arms for a class level.'
      operationId: listAllArmsForAClassLevel
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Classes & Arms'
    post:
      summary: 'Create a new class arm.'
      operationId: createANewClassArm
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Arm name.'
                  example: '"A"'
              required:
                - name
    parameters:
      -
        in: path
        name: classLevelId
        description: 'The class level UUID.'
        example: id
        required: true
        schema:
          type: string
  '/api/class-levels/{classLevelId}/arms/{id}/assign-teacher':
    patch:
      summary: 'Assign a teacher to a class arm.'
      operationId: assignATeacherToAClassArm
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_teacher_id:
                  type: string
                  description: 'Must be a valid UUID. The <code>id</code> of an existing record in the users table.'
                  example: de7040fd-87c4-33ad-9f61-b9e835c91bb8
              required:
                - assigned_teacher_id
    parameters:
      -
        in: path
        name: classLevelId
        description: ''
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'The ID of the arm.'
        example: id
        required: true
        schema:
          type: string
  '/api/class-levels/{classLevelId}/arms/{id}':
    patch:
      summary: 'Update a class arm name.'
      operationId: updateAClassArmName
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Arm name.'
                  example: null
              required:
                - name
    delete:
      summary: 'Delete a class arm (must have no students assigned).'
      operationId: deleteAClassArmmustHaveNoStudentsAssigned
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
    parameters:
      -
        in: path
        name: classLevelId
        description: 'The class level UUID.'
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'The arm UUID.'
        example: id
        required: true
        schema:
          type: string
  '/api/class-levels/{classLevelId}/subjects':
    get:
      summary: 'Get subjects available for a class level with teacher assignments.'
      operationId: getSubjectsAvailableForAClassLevelWithTeacherAssignments
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Classes & Arms'
    parameters:
      -
        in: path
        name: classLevelId
        description: ''
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'The class level UUID.'
        example: id
        required: true
        schema:
          type: string
  '/api/class-levels/{classLevelId}/subjects/sync':
    post:
      summary: 'Sync subjects assigned to a class level.'
      operationId: syncSubjectsAssignedToAClassLevel
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_ids:
                  type: array
                  description: 'Array of subject UUIDs to assign.'
                  example: null
                  items:
                    type: string
                compulsory_ids:
                  type: array
                  description: 'Array of subject UUIDs to mark as compulsory.'
                  example: null
                  items:
                    type: string
              required:
                - subject_ids
    parameters:
      -
        in: path
        name: classLevelId
        description: ''
        example: id
        required: true
        schema:
          type: string
      -
        in: path
        name: id
        description: 'The class level UUID.'
        example: id
        required: true
        schema:
