[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Render free web instance = 0.1 CPU / 512 MB.
; 6 PHP workers on 512 MB is a common OOM -> 502 cause. 4 is the safe ceiling.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

; Submit used to grade inline and could exceed 60s; grading is queued now, but
; PDF/result endpoints still benefit from headroom.
request_terminate_timeout = 120