openapi: 3.0.3
info:
  title: 'EduCBT API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: 'Academic Calendar'
    description: '* APIs for defining school years and terms.'
  -
    name: 'Authentication & Onboarding'
    description: '* APIs for user login, password resets, and initial school onboarding.'
  -
    name: 'Classes & Arms'
    description: '* APIs for managing class structures (e.g., JSS1) and specific arms (e.g., JSS1A), including subject mapping.'
  -
    name: 'Curriculum & Subjects'
    description: '* APIs for managing the academic curriculum and subject topics.'
  -
    name: Endpoints
    description: ''
  -
    name: 'Exam Administration'
    description: '* APIs for scheduling CBT sessions, attaching questions, live monitoring, and grading.'
  -
    name: 'Question Bank'
    description: '* APIs for creating and managing objective and theory questions.'
  -
    name: 'School Configuration'
    description: '* APIs for managing tenant-specific preferences and global grading scales.'
  -
    name: 'Staff Directory'
    description: '* APIs for managing teachers, roles, and subject assignments.'
  -
    name: 'Student Roster'
    description: '* APIs for managing student enrollments, profiles, and class placements.'
  -
    name: 'Super Admin: Billing & Subscriptions'
    description: '* APIs for managing available SaaS tiers and subscription logic.'
  -
    name: 'Super Admin: Platform Analytics'
    description: '* APIs for global SaaS metrics and platform-wide monitoring.'
  -
    name: 'Super Admin: Tenant Management'
    description: '* APIs for provisioning, suspending, and managing school instances.'
paths:
  /api/academic-sessions:
    get:
      summary: ''
      operationId: getApiAcademicSessions
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Academic Calendar'
      security: []
    post:
      summary: ''
      operationId: postApiAcademicSessions
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Academic Calendar'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                start_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-06-02T12:19:21'
                end_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>start_date</code>.'
                  example: '2052-06-25'
                is_current:
                  type: boolean
                  description: ''
                  example: false
              required:
                - name
                - start_date
                - end_date
      security: []
