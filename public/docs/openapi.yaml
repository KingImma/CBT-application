      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Handle availability checked.'
                  data:
                    available: true
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Handle availability checked.'
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                        example: true
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
              required:
                - handle
