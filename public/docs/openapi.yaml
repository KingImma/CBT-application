                  example: 977e5426-8d13-3824-86aa-b092f8ae52c5
                  nullable: true
                type:
                  type: string
                  description: ''
                  example: fill_blank
                  enum:
                    - mcq_single
                    - mcq_multi
                    - true_false
                    - fill_blank
                    - short_answer
                    - essay
                    - matching
                    - ordering
                difficulty:
                  type: string
                  description: ''
                  example: medium
                  enum:
                    - easy
                    - medium
                    - hard
                content:
                  type: string
                  description: ''
                  example: architecto
                explanation:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                default_marks:
                  type: number
                  description: 'Must be at least 0.5. Must not be greater than 100.'
                  example: 22
                time_estimate_seconds:
                  type: integer
                  description: 'Must be at least 10.'
                  example: 22
                  nullable: true
                image_url:
                  type: string
                  description: 'Must be a valid URL. Must not be greater than 500 characters.'
                  example: 'http://www.okuneva.com/fugiat-sunt-nihil-accusantium-harum-mollitia.html'
                  nullable: true
                metadata:
                  type: object
                  description: ''
                  example: null
                  properties:
                    tags:
                      type: object
                      description: ''
                      example: null
                      properties: {  }
                      nullable: true
                    source:
                      type: string
                      description: ''
                      example: architecto
                      nullable: true
                    year:
                      type: integer
                      description: ''
                      example: 16
                      nullable: true
                  nullable: true
                options:
                  type: array
                  description: 'Options: required for choice-based types. This field is required when <code>type</code> is <code>mcq_single</code>, <code>mcq_multi</code>, <code>true_false</code>, <code>matching</code>, or <code>ordering</code>. Must have at least 2 items.'
                  example: null
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                        description: 'Must not be greater than 10 characters.'
                        example: ngzmiy
                        nullable: true
                      content:
                        type: string
                        description: 'This field is required when <code>options</code> is present.'
                        example: architecto
                      image_url:
                        type: string
                        description: 'Must be a valid URL. Must not be greater than 500 characters.'
                        example: 'http://bailey.com/'
                        nullable: true
                      is_correct:
                        type: boolean
                        description: 'This field is required when <code>options</code> is present.'
                        example: true
                      order:
                        type: integer
                        description: ''
                        example: 16
                        nullable: true
                      match_pair:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: 'n'
                        nullable: true
                fill_blank_answers:
                  type: array
                  description: 'Fill-blank answers: required for fill_blank type. This field is required when <code>type</code> is <code>fill_blank</code>. Must have at least 1 items.'
                  example: null
                  items:
                    type: object
                    properties:
                      answer_text:
                        type: string
                        description: 'This field is required when <code>fill_blank_answers</code> is present. Must not be greater than 255 characters.'
                        example: g
                      is_primary:
                        type: boolean
                        description: ''
                        example: false
