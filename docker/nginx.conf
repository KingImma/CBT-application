worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;        # hide nginx version
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen      10000;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        charset utf-8;

        # ── Laravel routing ───────────────────────────────────────────────────
        # Try to serve the file/directory directly; fall through to index.php.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── Suppress noisy logs for common browser requests ───────────────────
        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt  { log_not_found off; access_log off; }

        # ── PHP-FPM ───────────────────────────────────────────────────────────
        # php-fpm is started with `php-fpm -D` in the same container and binds
        # to 127.0.0.1:9000 by default on Alpine.
        location ~ \.php$ {
            fastcgi_pass         127.0.0.1:9000;
            fastcgi_index        index.php;
            fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include              fastcgi_params;

            fastcgi_read_timeout 120;
            fastcgi_hide_header  X-Powered-By;
        }

        # ── Security: deny hidden files (.env, .git, .htaccess, …) ───────────
        location ~ /\. {
            deny all;
        }
    }
}
