  '/api/class-levels/{classLevelId}/arms/{armId}/subjects':
    get:
      summary: 'List subjects assigned to a specific arm.'
      operationId: listSubjectsAssignedToASpecificArm
      description: "Also returns unassigned subjects from the parent class level\nso the frontend can render the \"add subject\" options without extra calls."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Classes & Arms'
      security: []
    parameters:
      -
        in: path
        name: classLevelId
        description: ''
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: armId
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  '/api/class-levels/{classLevelId}/arms/{armId}/subjects/sync':
    post:
      summary: "Sync — replace the arm's entire subject list atomically."
      operationId: syncReplaceTheArmsEntireSubjectListAtomically
      description: "Best for a \"save curriculum\" UI where the admin sets all subjects at once.\nSubjects not in the list are detached, new ones are attached."
      parameters: []
      responses: {  }
      tags:
        - 'Classes & Arms'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_ids:
                  type: array
                  description: 'Must be a valid UUID. The <code>id</code> of an existing record in the subjects table.'
                  example:
                    - 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                  items:
                    type: string
                compulsory_ids:
                  type: array
                  description: 'Must be a valid UUID.'
                  example:
                    - 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                  items:
                    type: string
      security: []
    parameters:
      -
        in: path
        name: classLevelId
        description: ''
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: armId
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  '/api/class-levels/{classLevelId}/arms/{armId}/subjects/inherit':
    post:
      summary: "Copy the class level's full subject list to an arm."
