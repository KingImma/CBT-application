  /api/onboarding/check-handle:
    get:
      summary: ''
      operationId: getApiOnboardingCheckHandle
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Handle availability checked.'
                  data:
                    available: true
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Handle availability checked.'
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                        example: true
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
              required:
                - handle
      security: []
  /api/onboarding/register:
    post:
      summary: ''
      operationId: postApiOnboardingRegister
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Authentication & Onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schoolName:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                handle:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 63 characters.'
                  example: 'n'
                address:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: g
                  nullable: true
                state:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: m
                  nullable: true
                schoolType:
                  type: string
                  description: ''
                  example: architecto
                  enum:
                    - 'Primary School'
                    - 'Secondary School'
                    - Mixed
                  nullable: true
                fullName:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: ashly64@example.com
                phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: vdljnikhwaykcmyu
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: 'Xaz<m5L[)~=NG5a'
                plan_id:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - schoolName
                - handle
                - fullName
                - email
                - phone
                - password
      security: []
